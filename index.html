<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#003883" />
    <meta name="description" content="Onboard2Earn - staff-assisted customer onboarding and referral rewards application" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Onboard2Earn" />

    <!-- Apple iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Onboard2Earn" />
    
    <!-- Microsoft Windows Meta Tags -->
    <meta name="msapplication-TileColor" content="#003883" />
    <meta name="msapplication-TileImage" content="/favicon.svg" />
    <meta name="msapplication-config" content="none" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Splash Screen Color -->
    <meta name="apple-mobile-web-app-status-bar-style" content="#003883" />
    
    <title>Onboard2Earn</title>
    
    <!-- Preconnect for performance -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  </head>
  <body style="background-color: #f5f7f8;">
    <div id="root" style="background-color: #f5f7f8; min-height: 100vh;"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Register Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(registration => {
              console.log('[PWA] Service Worker registered:', registration.scope);
            })
            .catch(error => {
              console.error('[PWA] Service Worker registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
